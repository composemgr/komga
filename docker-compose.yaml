# nginx proxy address - http://172.17.0.1:25600

name: komga
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  komga:
    image: gotson/komga:latest
    pull_policy: always
    container_name: komga-app
    restart: always
    logging: *default-logging
    networks:
      - komga
    ports:
      - "172.17.0.1:25600:25600"
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
    volumes:
      - ./volumes/config/komga:/config
      - ./volumes/data/komga:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:25600"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  komga:
    name: komga
    external: false
